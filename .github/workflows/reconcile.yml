# Optional hosted review: use an independent private repository, not a public fork.
# Data, reports and optional issues are uploaded to GitHub. See RECONCILE.md.
name: Monthly bill reconcile
on:
  schedule:
    - cron: "0 9 3 * *"
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
concurrency:
  group: reconcile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reconcile:
    # Public forks must never be presented as private billing-data storage.
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install this reviewed source revision
        run: python -m pip install ./healthcheck
      - name: Review the configured billing period
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/reconcile_period.py
      - name: Store results on GitHub
        uses: actions/upload-artifact@v4
        with:
          name: reconcile-result
          path: |
            recount-report.txt
            recount-result.json
          retention-days: 7
          if-no-files-found: error
